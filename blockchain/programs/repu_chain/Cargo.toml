[package]
name = "repu-chain"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "repu_chain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang.workspace = true
solana-sha256-hasher.workspace = true

[dev-dependencies]
litesvm = "=0.18.2"
solana-keypair = "3"
solana-signer = "3"
solana-message = "4"
solana-transaction = { version = "4", features = ["verify"] }
