name: repuchain
services:
  postgres:
    image: postgres:17.7-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:env}
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm setup:env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
