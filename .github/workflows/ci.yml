name: Validate RepuChain
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-bookworm
        env:
          POSTGRES_USER: repuchain
          POSTGRES_PASSWORD: repuchain_local_only
          POSTGRES_DB: repuchain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repuchain -d repuchain"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
      TEST_DATABASE_URL: postgresql://repuchain:repuchain_local_only@localhost:5432/repuchain_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env
      - run: pnpm db:migrate
      - run: pnpm db:test:init
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm db:seed
      - run: pnpm smoke
      - run: pnpm mobile:check
      - run: pnpm db:check
